<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DEYE Top-3 Models — Stock Rotation since 1 June</title>
</head>
<body>
<style>
  .viz-root{
    color-scheme:light;
    --plane:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
    --good:#006300; --bad:#d03b3b;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--plane); color:var(--ink);
    max-width:940px; margin:0 auto; padding:30px 20px 54px;
  }
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])) .viz-root{
      color-scheme:dark;
      --plane:#0d0d0d; --surface:#1a1a19;
      --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70;
      --good:#0ca30c; --bad:#e34948;
    }
  }
  :root[data-theme="dark"] .viz-root{
    color-scheme:dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good:#0ca30c; --bad:#e34948;
  }
  .viz-root h1{font-size:23px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em;}
  .viz-root .sub{color:var(--ink2);font-size:14px;margin:0 0 24px;}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:26px;}
  @media(max-width:640px){.tiles{grid-template-columns:1fr;}}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px 16px;border-left:5px solid var(--c);}
  .tile .m{font-size:13px;font-weight:700;color:var(--ink);line-height:1.25;min-height:34px;}
  .tile .row{display:flex;align-items:baseline;justify-content:space-between;margin-top:9px;}
  .tile .now{font-size:29px;font-weight:800;letter-spacing:-.02em;}
  .tile .from{font-size:12.5px;color:var(--muted);}
  .tile .chg{font-size:12.5px;font-weight:700;margin-top:3px;}
  .tile .chg.dn{color:var(--bad);} .tile .chg.up{color:var(--good);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:20px 20px 12px;}
  .legend{display:flex;flex-wrap:wrap;gap:18px;margin:0 0 8px;font-size:13.5px;color:var(--ink2);}
  .legend span{display:inline-flex;align-items:center;gap:8px;font-weight:600;}
  .legend i{width:14px;height:14px;border-radius:3px;display:inline-block;}
  .chartwrap{position:relative;width:100%;overflow-x:auto;}
  svg{display:block;width:100%;height:auto;}
  .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);
       border-radius:8px;padding:9px 11px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.14);
       opacity:0;transition:opacity .08s;min-width:190px;z-index:5;}
  .tip .td{font-weight:700;margin-bottom:6px;color:var(--ink);}
  .tip .tr{display:flex;justify-content:space-between;gap:16px;color:var(--ink2);align-items:center;}
  .tip .tr b{color:var(--ink);font-variant-numeric:tabular-nums;}
  .tip .tr i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;}
  .foot{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;}
  table.dv{border-collapse:collapse;font-size:12px;margin-top:6px;width:100%;}
  table.dv th,table.dv td{border:1px solid var(--border);padding:3px 8px;text-align:right;font-variant-numeric:tabular-nums;}
  table.dv th:first-child,table.dv td:first-child{text-align:left;}
  details{margin-top:8px;} summary{cursor:pointer;font-size:12.5px;color:var(--ink2);font-weight:600;}
  .axlab{fill:var(--muted);font-size:11.5px;} .axline{stroke:var(--axis);} .gl{stroke:var(--grid);}
</style>

<div class="viz-root">
  <h1>DEYE — top-3 models, stock rotation since 1 June</h1>
  <p class="sub" id="sub"></p>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <div class="legend" id="leg"></div>
    <div class="chartwrap"><div class="tip" id="tip"></div><svg id="c" viewBox="0 0 900 400" preserveAspectRatio="xMidYMid meet"></svg></div>
    <details><summary>Data table</summary><div id="tbl"></div></details>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
const D = {"g2": {"dates": ["2026-06-01", "2026-06-02", "2026-06-03", "2026-06-04", "2026-06-05", "2026-06-06", "2026-06-07", "2026-06-08", "2026-06-09", "2026-06-10", "2026-06-11", "2026-06-12", "2026-06-13", "2026-06-14", "2026-06-15", "2026-06-16", "2026-06-17", "2026-06-18", "2026-06-19", "2026-06-20", "2026-06-21", "2026-06-22", "2026-06-23", "2026-06-24", "2026-06-25", "2026-06-26", "2026-06-27", "2026-06-28", "2026-06-29", "2026-06-30", "2026-07-01", "2026-07-02", "2026-07-03", "2026-07-04", "2026-07-05", "2026-07-06", "2026-07-07", "2026-07-08", "2026-07-09", "2026-07-10", "2026-07-11", "2026-07-12", "2026-07-13", "2026-07-14", "2026-07-15", "2026-07-16", "2026-07-17", "2026-07-18", "2026-07-19", "2026-07-20", "2026-07-21", "2026-07-22", "2026-07-23", "2026-07-24", "2026-07-25", "2026-07-26", "2026-07-27", "2026-07-28", "2026-07-29", "2026-07-30", "2026-07-31"], "series": [{"model": "Bat. DEYE PRO-С SE-F5 5.12kWh", "full": "Акумулятор DEYE PRO-С SE-F5 5.12kWh", "kind": "battery", "jun1": 742.0, "now": 407.0, "values": [742.0, 742.0, 741.0, 739.0, 739.0, 739.0, 739.0, 739.0, 739.0, 738.0, 738.0, 736.0, 736.0, 736.0, 734.0, 734.0, 733.0, 732.0, 728.0, 728.0, 728.0, 728.0, 728.0, 726.0, 726.0, 724.0, 724.0, 724.0, 714.0, 709.0, 708.0, 689.0, 688.0, 688.0, 688.0, 682.0, 673.0, 657.0, 645.0, 622.0, 622.0, 622.0, 614.0, 605.0, 603.0, 594.0, 587.0, 587.0, 587.0, 547.0, 541.0, 531.0, 513.0, 476.0, 476.0, 476.0, 461.0, 441.0, 424.0, 411.0, 407.0]}, {"model": "Inv. DEYE 6K SG05LP1", "full": "Інвертор DEYE 6K SG05LP1", "kind": "inverter", "jun1": 269.0, "now": 151.0, "values": [269.0, 269.0, 269.0, 268.0, 268.0, 268.0, 268.0, 267.0, 267.0, 267.0, 267.0, 266.0, 266.0, 266.0, 265.0, 265.0, 264.0, 264.0, 264.0, 264.0, 264.0, 264.0, 264.0, 263.0, 262.0, 262.0, 262.0, 262.0, 259.0, 246.0, 244.0, 242.0, 239.0, 239.0, 239.0, 225.0, 217.0, 195.0, 148.0, 120.0, 120.0, 120.0, 93.0, 403.0, 381.0, 371.0, 357.0, 357.0, 357.0, 339.0, 331.0, 313.0, 283.0, 249.0, 249.0, 249.0, 212.0, 191.0, 170.0, 155.0, 151.0]}, {"model": "Bat. DEYE PRO-B SE-G5.1 5.12kWh", "full": "Акумулятор DEYE PRO-B SE-G5.1 5.12kWh", "kind": "battery", "jun1": 211.0, "now": 4.0, "values": [211.0, 211.0, 211.0, 210.0, 210.0, 210.0, 210.0, 209.0, 209.0, 206.0, 206.0, 206.0, 206.0, 206.0, 203.0, 203.0, 202.0, 198.0, 198.0, 198.0, 198.0, 198.0, 197.0, 197.0, 197.0, 196.0, 196.0, 196.0, 188.0, 183.0, 175.0, 172.0, 146.0, 146.0, 146.0, 132.0, 128.0, 127.0, 120.0, 97.0, 97.0, 97.0, 89.0, 88.0, 83.0, 66.0, 48.0, 48.0, 48.0, 33.0, 28.0, 25.0, 21.0, 20.0, 20.0, 20.0, 15.0, 15.0, 15.0, 4.0, 4.0]}]}, "summary": {"as_of": "2026-07-31", "inv_apr1": 463.0, "inv_now": 375.0, "bat_apr1": 1361.0, "bat_now": 564.0, "n_products": 22}};
const NF = new Intl.NumberFormat('en-US');
const W=900,H=400, M={t:20,r:74,b:36,l:48};
const IW=W-M.l-M.r, IH=H-M.t-M.b;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = s => { const [y,m,dd]=s.split('-'); return dd+' '+MON[+m-1]; };
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;let s=n<=1?1:n<=2?2:n<=5?5:10;return s*p;}
function xAt(i,n){return M.l + (n<=1?0:i/(n-1))*IW;}
function yAt(v,max){return M.t + IH - (v/max)*IH;}

const g=D.g2, dates=g.dates, n=dates.length, S=g.series;
const cols=['var(--s1)','var(--s2)','var(--s3)'];
const max=niceMax(Math.max(...S.flatMap(s=>s.values)));
const svg=document.getElementById('c'); let s='';
for(let t=0;t<=4;t++){const v=max*t/4, y=yAt(v,max);
  s+=`<line class="gl" x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}"/>`;
  s+=`<text class="axlab" x="${M.l-8}" y="${y+3.5}" text-anchor="end">${NF.format(Math.round(v))}</text>`;}
s+=`<line class="axline" x1="${M.l}" y1="${M.t+IH}" x2="${W-M.r}" y2="${M.t+IH}"/>`;
const step=Math.max(1,Math.round(n/7));
for(let i=0;i<n;i+=step){const x=xAt(i,n);
  s+=`<text class="axlab" x="${x}" y="${M.t+IH+19}" text-anchor="middle">${fmtDate(dates[i])}</text>`;}
S.forEach((ser,k)=>{
  const pts=ser.values.map((v,i)=>xAt(i,n)+','+yAt(v,max)).join(' ');
  s+=`<polyline fill="none" stroke="${cols[k]}" stroke-width="2.6" points="${pts}" stroke-linejoin="round"/>`;
  const lx=xAt(n-1,n), ly=yAt(ser.values[n-1],max);
  s+=`<circle cx="${lx}" cy="${ly}" r="4" fill="${cols[k]}" stroke="var(--surface)" stroke-width="1.5"/>`;
  s+=`<text x="${lx+8}" y="${ly+4}" font-size="12.5" font-weight="700" fill="${cols[k]}">${NF.format(ser.values[n-1])}</text>`;
});
s+=`<line id="cr" x1="0" y1="${M.t}" x2="0" y2="${M.t+IH}" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
svg.innerHTML=s;

document.getElementById('sub').textContent=
  `Units on hand across all Energynat UA warehouses · 1 Jun → ${D.summary.as_of} · the three DEYE models holding the most stock on 1 June`;
let lg='';
S.forEach((ser,k)=>{lg+=`<span><i style="background:${cols[k]}"></i>${ser.model}</span>`;});
document.getElementById('leg').innerHTML=lg;

// tiles
let tl='';
S.forEach((ser,k)=>{
  const pct=ser.jun1?Math.round((ser.now-ser.jun1)/ser.jun1*100):0;
  tl+=`<div class="tile" style="--c:${cols[k]}"><div class="m">${ser.model}</div>`+
      `<div class="row"><span class="now">${NF.format(ser.now)}</span><span class="from">from ${NF.format(ser.jun1)} on 1 Jun</span></div>`+
      `<div class="chg ${pct<0?'dn':'up'}">${pct<0?'▼':'▲'} ${pct}% (${NF.format(ser.now-ser.jun1)} units)</div></div>`;
});
document.getElementById('tiles').innerHTML=tl;

const tip=document.getElementById('tip'), cr=document.getElementById('cr');
svg.addEventListener('mousemove',ev=>{
  const r=svg.getBoundingClientRect(), sx=(ev.clientX-r.left)/r.width*W;
  let i=Math.round((sx-M.l)/IW*(n-1)); i=Math.max(0,Math.min(n-1,i));
  const x=xAt(i,n); cr.setAttribute('x1',x); cr.setAttribute('x2',x); cr.setAttribute('opacity','1');
  tip.style.opacity=1;
  let h=`<div class="td">${fmtDate(dates[i])} ${dates[i].slice(0,4)}</div>`;
  S.forEach((ser,k)=>{h+=`<div class="tr"><span><i style="background:${cols[k]}"></i>${ser.model}</span><b>${NF.format(ser.values[i])}</b></div>`;});
  tip.innerHTML=h;
  const px=(x/W)*r.width; tip.style.left=Math.min(r.width-205,Math.max(0,px+12))+'px'; tip.style.top='14px';
});
svg.addEventListener('mouseleave',()=>{tip.style.opacity=0;cr.setAttribute('opacity','0');});

let tb='<table class="dv"><tr><th>Date</th>'+S.map(x=>'<th>'+x.model+'</th>').join('')+'</tr>';
const idx=[...Array(n).keys()].filter(i=>i%5===0||i===n-1);
idx.forEach(i=>{tb+=`<tr><td>${fmtDate(dates[i])}</td>`+S.map(x=>'<td>'+NF.format(x.values[i])+'</td>').join('')+'</tr>';});
document.getElementById('tbl').innerHTML=tb+'</table>';

document.getElementById('foot').textContent=
  'Source: BAF inventory accumulation register (ЗапасыНаСкладах) — daily balances reconstructed from the Receipt/Expense movement ledger, Energynat UA warehouses only (Chmielnicki, Kijów, Lwów, Odessa). DEYE brand only.';
</script>

</body>
</html>
